name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        # Two passes: the whole project, then core/ and sim/ with the DOM lib
        # removed, so those layers cannot reach the browser (ADR-0002).
        run: npm run typecheck

      - name: Lint
        # Includes the layer-boundary rules. A renderer import inside src/sim/
        # fails here, which is the point.
        run: npm run lint

      - name: Content
        # Schema validation plus cross-file checks: a wave naming an enemy that
        # does not exist, a plot off the map, an unlock chain that cannot
        # complete. Typecheck above already rejects a bad id via the generated
        # references; this reports it in language a content author can act on.
        run: npm run content:lint

      - name: Determinism
        # Its own step rather than buried in the suite: this is the invariant
        # replays, bug reproduction and the balance simulator all rest on, and
        # when it breaks the failure should say so by name.
        run: npm run test:determinism

      - name: Test
        run: npm run test:coverage

      - name: Build
        # vite build directly, not `npm run build` — that would re-run the
        # typecheck the previous step already did.
        run: npx vite build

      - name: Bundle budget
        run: npm run bundle:check

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conventional Commits
        # Only the commits this PR adds. Linting all history would fail on the
        # repository's initial commit, which predates the convention.
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # The gate used to be one job over one stage. Region 1 made it ten, and the
  # work grew with both the count and the length of the later stages — the
  # single job hit its ten-minute wall. Splitting by stage keeps the 200 runs
  # the statistics want and keeps wall-clock roughly flat as regions 2-5 land,
  # which a larger timeout would not. Findings are computed per stage and
  # strategy, so a stage per job reaches the same verdict as one job for all.
  balance-stages:
    name: balance stages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stages: ${{ steps.list.outputs.stages }}
    steps:
      - uses: actions/checkout@v4

      # Read off the content directory rather than written out here, so
      # authoring a stage puts it behind the gate with no workflow edit. A
      # hardcoded list would quietly stop covering stage eleven.
      - id: list
        run: |
          stages=$(ls src/content/data/stages/*.json \
            | xargs -n1 basename \
            | sed 's/\.json$//' \
            | sort -t- -k1,1n -k2,2n \
            | jq -R . | jq -sc .)
          echo "stages=$stages" >> "$GITHUB_OUTPUT"
          echo "$stages"

  balance-stage:
    name: balance ${{ matrix.stage }}
    needs: balance-stages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every stage reports. Stopping at the first failure would hide whether
      # a tuning edit moved one stage or the whole region.
      fail-fast: false
      matrix:
        stage: ${{ fromJson(needs.balance-stages.outputs.stages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This stage and every strategy against its authored win-rate band.
      # Fails the build when a stage falls outside the band its content
      # declares, which is what stops a quiet tuning edit from making stage
      # four unwinnable three months before anyone plays it.
      #
      # 200 runs per strategy rather than the 2,000 a local sweep uses: enough
      # to catch a stage that has genuinely moved, few enough to stay inside a
      # PR's patience. Seeds are fixed, so two runs of this job compare.
      - name: Balance
        run: npm run balance -- --stage ${{ matrix.stage }} --runs 200 --json balance-report.json

      # Kept whatever the outcome — the report is most wanted on the run that
      # failed, and #59's live-balancing loop will read the same file.
      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report-${{ matrix.stage }}
          path: balance-report.json
          if-no-files-found: warn

  # One check name for the whole gate, so branch protection has a single thing
  # to require however many stages the matrix grows to.
  balance:
    name: balance
    needs: balance-stage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        run: |
          result='${{ needs.balance-stage.result }}'
          echo "stage matrix: $result"
          [ "$result" = 'success' ] || exit 1

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Placeholder. Becomes real in #53: Playwright across chromium, firefox
      # and webkit, plus a performance trace that fails on a >15% mean
      # frame-time regression.
      - run: echo "e2e — Playwright not set up yet (#53)."
